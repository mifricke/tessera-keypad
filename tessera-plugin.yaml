# Code lock: a keypad on the screen. When the right code is typed, the screen runs an action in Home Assistant on the
# tile's entity: it unlocks a lock, runs a script or a scene, presses a button. Every field is explained in the plugins
# repository's docs/MANIFEST.md.
id: code_lock
version: 0.3.0
api: "0.15"
icon: lock
maintainer: mifricke
license: MIT
stage: beta
topics: [home]
requires:
  esphome: 2026.6.2
boards: any
flash_kb: 12

permissions:
  # The one action of the chosen entity that the right code runs, by its domain.
  home_assistant_actions: [lock.unlock, cover.open_cover, switch.toggle, input_boolean.toggle, light.toggle,
                           script.turn_on, scene.turn_on, button.press]

tiles:
  - id: keypad
    name: tile_name
    icon: lock
    sizes: { min: 1x1, max: 2x2 }
    memory: 500
    example: tile_example
    options:
      # What the right code acts on: only entities it can switch, in a list the editor searches.
      - { id: target, kind: entity, domains: [lock, cover, switch, input_boolean, light, script, scene, button],
          label: target, hint: target_hint }
      - { id: code, kind: text, label: code, hint: code_hint }
      - { id: attempts, kind: number, label: attempts, hint: attempts_hint, min: 1, max: 10, default: 3 }
      - { id: wait, kind: number, label: wait, hint: wait_hint, min: 5, max: 600, step: 5, unit: s, default: 30 }

cards:
  - { id: keys, name: card_name }
